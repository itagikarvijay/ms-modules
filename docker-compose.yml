services:
  service-one:
    container_name: order-service
    build:
      context: d:/oatuh2/ms/order-service
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/market?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      mysql-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - my-apps-network

  service-two:
    container_name: product-service
    build:
      context: d:/oatuh2/ms/product-service
      dockerfile: Dockerfile
    ports:
      - 8182:8182
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/market?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - OTEL_SERVICE_NAME=product-service
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      mysql-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - my-apps-network

  service-eureka:
    container_name: eureka-server
    build:
      context: d:/oatuh2/ms/eureka/service
      dockerfile: Dockerfile
    ports:
      - 8761:8761
    networks:
      - my-apps-network

  service-discovery:
    container_name: discovery-service
    build:
      context: d:/oatuh2/ms/gateway/service
      dockerfile: Dockerfile
    ports:
      - 8762:8762
    networks:
      - my-apps-network

  service-three:
    container_name: auth-service
    build:
      context: d:/oatuh2/authorization
      dockerfile: Dockerfile
    ports:
      - 9000:9000
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/market?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - my-apps-network

  service_four:
    container_name: grpc-service
    build:
      context: D:/grpc-microservices
      dockerfile: Dockerfile
    ports:
      - 9090:9090
    networks:
      - my-apps-network

  envoy:
    image: envoyproxy/envoy:v1.29-latest
    container_name: grpc-web-envoy
    ports:
      - '9092:9092'
      - '9901:9090'
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: -c /etc/envoy/envoy.yaml
    networks:
      - my-apps-network



  #  service-four:
#    container_name: resource-service
#    build:
#      context: d:/oatuh2/resource
#      dockerfile: Dockerfile
#    ports:
#      - 8282:8282
#    environment:
#      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/market?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
#      - SPRING_DATASOURCE_USERNAME=root
#      - SPRING_DATASOURCE_PASSWORD=root
#    depends_on:
#      mysql-db:
#        condition: service_healthy
#    networks:
#      - my-apps-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
      - "9464:9464"   # Prometheus scrape endpoint
    networks:
      - my-apps-network

#  prometheus:
#    image: prom/prometheus:latest
#    volumes:
#      - ./prometheus.yml:/etc/prometheus/prometheus.yml
#    ports:
#      - "9090:9090"
#    networks:
#      - my-apps-network



  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC
      - "14268:14268" # HTTP ingest
      - "6831:6831/udp" # Thrift compact
    networks:
      - my-apps-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - my-apps-network
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config/loki-config.yaml -config.expand-env=true
    volumes:
      - loki-data:/loki
      - ./loki-config.yaml:/etc/loki/config/loki-config.yaml:ro
    networks:
      - my-apps-network

#  react-frontend:
#    build:
#      context: d:/vit/my-react-app
#      dockerfile: Dockerfile
#    ports:
#      - "5173:80"
#    depends_on:
#      - service-one
#      - service-two
#      - service-three
#    networks:
#      - my-apps-network

  mysql-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=market
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my-apps-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail.yaml:/etc/promtail/promtail.yaml
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - my-apps-network

networks:
  my-apps-network:
    driver: bridge

volumes:
  loki-data: